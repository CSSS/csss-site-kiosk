<article
  class="bus-departure-card"
  [class.bus-departure-card--arrived]="statusDetails().variant === 'arrived'"
  [class.bus-departure-card--cancelled]="statusDetails().variant === 'cancelled'"
  [class.bus-departure-card--delayed]="statusDetails().variant === 'delayed'"
  [class.bus-departure-card--early]="statusDetails().variant === 'early'"
  [class.bus-departure-card--on-time]="statusDetails().variant === 'on-time'"
>
  <div class="bus-departure-card__time">
    <span
      class="bus-departure-card__minutes"
      [style.font-size]="displayTime() > 99 ? '2rem' : '3rem'"
    >
      {{ displayTime() | number: '1.0-0' }}
    </span>
    <span class="bus-departure-card__units">MIN</span>
  </div>

  <div class="bus-departure-card__details">
    <div class="bus-departure-card__summary">
      <span class="bus-departure-card__route">{{ departure().routeNumber }}</span>
      <span class="bus-departure-card__location">{{ location() }}</span>
    </div>
    <div class="bus-departure-card__meta">
      <span class="bus-departure-card__destination">{{ destination() }}</span>
      <span class="bus-departure-card__status">{{ statusDetails().text }}</span>
    </div>
  </div>
</article>
