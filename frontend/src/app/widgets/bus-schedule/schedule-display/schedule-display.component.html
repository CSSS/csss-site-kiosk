@let nextDeparture = departures()?.[0];
<div class="route">
  <h2 class="route__label">{{ routeNumber() }}</h2>
  <div [class]="`status${getStatusClass(nextDeparture?.status)}`" (click)="openScheduleModal()">
    <div class="route__content">
      <div class="route__time">
        @if (nextDeparture) {
          {{ getDisplayTime(nextDeparture?.secondsUntilDeparture ?? 0) }}
        } @else {
          --
        }
      </div>
      <div class="route__units">
        @if (nextDeparture) {
          MIN
        }
      </div>
    </div>
  </div>
</div>
