<h2>Community Board</h2>
<swiper-container init="false" #swiperRef>
  @for (event of events(); track event.eid) {
    <swiper-slide>
      <ksk-date-card
        class="card"
        [date]="event.startDatetime"
        [title]="event.name"
        [description]="event.description"
        [imgSrc]="getFallbackPosterUrl(0, event?.posterUrl)"
        [width]="cardWidth"
        [height]="(cardWidth * 5) / 4"
      />
    </swiper-slide>
  }
</swiper-container>
