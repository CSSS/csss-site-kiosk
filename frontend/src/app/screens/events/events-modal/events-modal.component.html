<img class="poster" [ngSrc]="event().image_url" [height]="imgHeight" [width]="imgWidth" />
<section class="details">
  <section class="link">
    @if (event().url; as url) {
      <qrcode [qrdata]="url" [width]="qrCodeSize" [margin]="0"></qrcode>
      <p>{{ url }}</p>
    }
  </section>
  <ksk-event-details [event]="event()" />
</section>
<section class="description">
  <p>{{ event().description }}</p>
</section>
