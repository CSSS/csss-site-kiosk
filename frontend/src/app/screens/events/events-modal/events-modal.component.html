<img class="poster" [ngSrc]="event().image_url" [height]="400" [width]="500" />
@if (event().url; as url) {
  <section class="link">
    <qrcode [qrdata]="url" [width]="180" [margin]="0"></qrcode>
    <p>{{ url }}</p>
  </section>
}
<section class="details">
  <ksk-event-details [event]="event()" />
</section>
<section class="description">
  <p>{{ event().description }}</p>
</section>
