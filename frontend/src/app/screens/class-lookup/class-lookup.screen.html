<section class="class-widget">
  <h2>Courses</h2>
  <div class="courses">
    <ul class="course-list">
      @for (c of courses(); track c.title) {
        <li class="card">
          <div>{{ c.department | uppercase }} {{ c.value | uppercase }}</div>
          <div>{{ c.title }}</div>
        </li>
      }
    </ul>
  </div>
</section>
<section class="filter-widget"></section>
