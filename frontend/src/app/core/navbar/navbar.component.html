<nav>
  @for (item of navItems(); track $index) {
    <a
      class="nav-button"
      [routerLink]="item.url"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <svg [lucideIcon]="item.icon" [size]="48"></svg>
      <div class="nav-button__label">{{ item.label }}</div>
    </a>
  }
</nav>
