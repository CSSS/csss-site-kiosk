@if (useFallbackImage()) {
  <img [src]="fallbackImageSrc" [alt]="title()" [width]="width()" [height]="height()" />
} @else {
  <img
    [ngSrc]="imgSrc()"
    [alt]="title()"
    [width]="width()"
    [height]="height()"
    (error)="handleImageError()"
  />
}
<div class="date">
  <div class="day">{{ date() | date: 'd' }}</div>
  <div class="month">{{ date() | date: 'MMM' }}</div>
</div>
<div class="info">
  <h3 class="info__title">{{ title() }}</h3>
  <p class="info__description">
    {{ description() }}
  </p>
</div>
