<img [ngSrc]="imgSrc()" [alt]="title()" [width]="width()" [height]="height()" />
<div class="date">
  <div class="day">{{ date() | date: 'd' }}</div>
  <div class="month">{{ date() | date: 'MMM' }}</div>
</div>
<div class="info">
  <h2 class="info__title">{{ title() }}</h2>
  <p class="info__description">
    {{ description() }}
  </p>
</div>
