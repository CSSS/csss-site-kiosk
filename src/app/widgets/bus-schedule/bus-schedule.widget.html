<h2>departures @ upper loop</h2>
<div class="schedule">
  @for (bus of nextDepartures(); track $index) {
    <div class="route">
      <h2>{{ bus.routeNumber }}</h2>
      <div [class]="bus.status">
        <br />
        {{ getDisplayTime(bus.secondsUntilDeparture) }}
      </div>
    </div>
  }
</div>
