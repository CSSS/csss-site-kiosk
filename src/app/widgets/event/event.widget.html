<div class="carousel">
  <swiper-container init="false" #swiperRef>
    @for (event of events; track $index) {
      <swiper-slide>
        <div class="card">
          <img
            class="card__img"
            [ngSrc]="event.posterUrl"
            alt="title"
            width="380"
            height="500"
            priority
          />
        </div>
      </swiper-slide>
    }
  </swiper-container>
</div>
