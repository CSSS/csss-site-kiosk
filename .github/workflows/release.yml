# Triggers on any tag push like v1.2.3 and publishes a GitHub Release
# with a zip containing the built backend + built Angular frontend.
# Requires a tag in the format `vX.Y.Z`.

name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Inject frontend version
        run: |
          printf "export const BUILD_VERSION = '%s';\n" "${GITHUB_REF_NAME}" \
            > frontend/src/app/app.version.ts

      # The server compiler and type-only workspace are development dependencies,
      # so compile before reinstalling production dependencies.
      - name: Build application
        run: npm run build

      # Reinstall only the server's runtime dependencies before packaging.
      # npm workspaces place these in the root node_modules directory.
      - name: Install production server dependencies
        run: npm ci --omit=dev --workspace server

      # ---- Package ----
      - name: Assemble release package
        run: |
          mkdir -p release/server
          mkdir -p release/frontend/dist/csss-site-kiosk/browser

          cp server/dist/server.js release/server/
          printf '{"private":true,"type":"module"}\n' > release/server/package.json
          cp -r node_modules release/server/node_modules
          rm -f release/server/node_modules/server
          rm -f release/server/node_modules/@csss-kiosk/shared
          rm -rf release/server/node_modules/typescript
          rm -f release/server/node_modules/.bin/tsc
          rm -f release/server/node_modules/.bin/tsserver
          rmdir release/server/node_modules/@csss-kiosk 2>/dev/null || true

          cp -r frontend/dist/csss-site-kiosk/browser/. \
            release/frontend/dist/csss-site-kiosk/browser/

          # record the version being shipped
          printf '%s\n' "${GITHUB_REF_NAME}" > release/VERSION

      - name: Verify release package
        run: |
          test -f release/VERSION
          test -f release/server/server.js
          test ! -e release/server/server.ts
          test ! -e release/server/dist
          test -f release/server/package.json
          test "$(node -p "require('./release/server/package.json').type")" = "module"
          test ! -e release/server/.env.example
          test ! -e release/shared
          test -d release/server/node_modules/express
          test ! -e release/server/node_modules/typescript
          test ! -e release/server/node_modules/@types
          test ! -L release/server/node_modules/server
          test ! -L release/server/node_modules/@csss-kiosk/shared
          test -z "$(find release -xtype l -print -quit)"
          test -f release/frontend/dist/csss-site-kiosk/browser/index.html
          test -z "$(find release -type f -name '*.ts' ! -name '*.d.ts' -print -quit)"
          node --check release/server/server.js

          KIOSK_API_SECRET=release-test \
            PROXY_TARGET=http://127.0.0.1:1 \
            SERVER_PORT=18080 \
            node release/server/server.js &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          health=""
          for _ in {1..20}; do
            if health=$(curl --fail --silent http://127.0.0.1:18080/health); then
              break
            fi
            sleep 0.5
          done

          jq --exit-status --arg version "${GITHUB_REF_NAME}" \
            '.version == $version and (.startedAt | type == "number")' \
            <<< "$health" >/dev/null
          kill "$server_pid"
          wait "$server_pid" || true
          trap - EXIT

      - name: Zip release package
        run: |
          cd release
          zip -r ../app-${GITHUB_REF_NAME}.zip .
          cd ..
          sha256sum app-${GITHUB_REF_NAME}.zip > app-${GITHUB_REF_NAME}.zip.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app-${{ github.ref_name }}.zip
            app-${{ github.ref_name }}.zip.sha256
          generate_release_notes: true
